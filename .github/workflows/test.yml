name: Test
on:
  push:
    branches:
      - "**/*"
    tags:
      - "v*"
      - "*@v*"

jobs:
  perl:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        config:
          - { image: centos7 }
          - { image: bullseye }
          - { image: fedora35 }
          - { image: fedora37 }
          - { image: fedora40 }
          - { image: fedora42 }
          - { image: fedora43 }
          - { image: fedora44 }
          - { image: cloud7 }
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
          repository: movabletype/movabletype
          ref: develop
          path: mt
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
          repository: movabletype/mt-plugin-MFA
          ref: main
          path: mfa
      - uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run tests
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/mt:/app \
            -v ${{ github.workspace }}/mfa/plugins/MFA:/app/plugins/MFA \
            -v ${{ github.workspace }}/plugins/MFA-TOTP:/app/plugins/MFA-TOTP \
            -w /app \
            ghcr.io/movabletype/movabletype/test:${{ matrix.config.image }} \
          prove -j4 -PMySQLPool=MT::Test::Env -It/lib \
            plugins/MFA-TOTP/t
